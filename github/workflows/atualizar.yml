name: Publicar painel

# Roda sempre que um XLSX novo chega em dados/xlsx (enviado pelo Google Apps Script)
# ou quando o painel/scripts sao alterados.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["index.html", "scripts/**", "dados/xlsx/**", ".github/workflows/atualizar.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl==3.1.5

      - name: Gerar dados do painel a partir de todo o historico
        run: python scripts/gerar_dados.py

      - name: Montar site (somente painel e JSON; os XLSX nao sao publicados)
        run: |
          mkdir -p _site/dados
          cp index.html _site/
          cp dados/resumo.json _site/dados/
          cp -r dados/json _site/dados/json
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: publicar
        uses: actions/deploy-pages@v4
